[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eisheater"
version = "0.1.0"
description = "Identify the equivalent circuit model of EIS spectra with a Pydantic AI agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.0",
    "openai>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    # The three kiss python bindings are local pybind11 packages with no public wheels; install
    # them into the venv from their checkouts before running:
    #   ../kisstypepy    -> kisstype   (reads the .eis/EISF spectra)
    #   ../eisfitpy      -> eisfit     (fits the circuits, in process, no CLI involved)
    #   ../eisgeneratorpy-> eisgenerator (simulates circuits for the simulate tool)
]

[project.scripts]
eisheater = "eisheater.__main__:main"

[tool.setuptools]
packages = ["eisheater"]
